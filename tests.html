<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>שירספוט — בדיקות</title>
<style>
  body { background:#07090a; color:#eaf2ec; font-family:'Heebo',system-ui,sans-serif; padding:22px; max-width:900px; margin:0 auto; }
  h1 { font-size:22px; } h2 { font-size:15px; color:#8a9a90; margin-top:26px; border-bottom:1px solid #1d2a22; padding-bottom:6px; }
  .row { display:flex; gap:10px; padding:5px 0; font-size:13.5px; align-items:baseline; border-bottom:1px solid rgba(255,255,255,.04); }
  .ok  { color:#22e06a; font-weight:700; flex:none; width:34px; }
  .bad { color:#ff4d5e; font-weight:700; flex:none; width:34px; }
  .name { flex:1; }
  .got { color:#5d6b63; font-family:ui-monospace,monospace; font-size:11.5px; direction:ltr; text-align:left; max-width:45%; overflow-wrap:anywhere; }
  #summary { margin:18px 0; padding:14px; border-radius:10px; font-weight:700; font-size:16px; }
  .pass { background:rgba(34,224,106,.12); border:1px solid #22e06a; }
  .fail { background:rgba(255,77,94,.12); border:1px solid #ff4d5e; }
</style>
</head>
<body>
<h1>שירספוט — בדיקות אוטומטיות</h1>
<div id="summary">מריץ…</div>
<div id="out"></div>

<script src="assets/js/hebrew.js"></script>
<script src="assets/js/search.js"></script>
<script src="assets/js/audio.js"></script>
<script src="assets/js/game.js"></script>
<script src="data/songs.js"></script>
<script>
/* Keep the player's real stats out of harm's way while we exercise Game. */
var SNAPSHOT = {};
['shirspot.stats.v1','shirspot.recent.v1','shirspot.genre','shirspot.seen'].forEach(function(k){
  SNAPSHOT[k] = localStorage.getItem(k);
});

var pass = 0, fail = 0, out = document.getElementById('out');

function section(t){ var h=document.createElement('h2'); h.textContent=t; out.appendChild(h); }
function check(name, actual, expected){
  var ok = JSON.stringify(actual) === JSON.stringify(expected);
  ok ? pass++ : fail++;
  var d=document.createElement('div'); d.className='row';
  d.innerHTML = '<span class="'+(ok?'ok':'bad')+'">'+(ok?'PASS':'FAIL')+'</span>'+
                '<span class="name">'+name+'</span>'+
                '<span class="got">'+(ok?'':'got '+JSON.stringify(actual)+' want '+JSON.stringify(expected))+'</span>';
  out.appendChild(d);
}

var DB = window.SONGS_DB || [];
var idx = SongSearch.buildIndex(DB);
function topArtists(q,n){ return SongSearch.search(idx,q,{limit:n||3}).map(function(h){return h.song.artist;}); }
function firstIs(q, artist, title){
  var r = SongSearch.search(idx,q,{limit:1})[0];
  return !!r && r.song.artist===artist && r.song.title.indexOf(title)!==-1;
}
function song(a,t){ return DB.find(function(s){ return s.artist.indexOf(a)!==-1 && s.title.indexOf(t)!==-1; }); }

/* ---------------- normalisation ---------------- */
section('נרמול עברית');
check('מסיר ניקוד',            Heb.norm('שָׁלוֹם'), 'שלומ');
check('אותיות סופיות',          Heb.norm('שלום'), Heb.norm('שלומ'));
check('גרש/גרשיים',             Heb.norm('שב"ק ס\''), 'שבק ס');
check('כתיב מלא/חסר (יי)',      Heb.norm('אייל'), Heb.norm('איל'));
check('רווחים מיותרים',         Heb.norm('  עומר   אדם '), 'עומר אדמ');
check('הומופון ע/א',            Heb.phonetic('ננעלו'), Heb.phonetic('ננאלו'));
check('הומופון ח/כ',            Heb.phonetic('חדד'), Heb.phonetic('כדד'));
check('פריסת מקלדת אנגלית',     Heb.fromEnLayout('akuo'), 'שלומ');

/* ---------------- search ---------------- */
section('חיפוש — שם זמר מחזיר את כל שיריו');
check('עומר אדם',   topArtists('עומר אדם'),  ['עומר אדם','עומר אדם','עומר אדם']);
check('משינה (לטינית)', topArtists('Mashina'), ['משינה','משינה','משינה']);
check('שם חלקי',    topArtists('סטטיק')[0],  'סטטיק ובן אל תבורי');
check('בלי רווח',   topArtists('עומראדם')[0],'עומר אדם');
check('שגיאת כתיב בזמר', topArtists('עמר אדם')[0], 'עומר אדם');
check('הומופון בזמר',    topArtists('שרית כדד')[0], 'שרית חדד');
check('ק/כ בזמר',        topArtists('כובי פרץ')[0], 'קובי פרץ');

section('חיפוש — כותרות');
check('כותרת מלאה',        firstIs('שלח לי מלאך','משינה','שלח לי מלאך'), true);
check('אות סופית שגויה',   firstIs('שלח לי מלאכ','משינה','שלח לי מלאך'), true);
check('שגיאת כתיב בכותרת', firstIs('רכבת לילא','משינה','רכבת לילה'), true);
check('כותרת לטינית',      firstIs('Tudo Bom','סטטיק ובן אל תבורי','Tudo Bom'), true);
check('סוגריים בכותרת',    firstIs('אם ננעלו','עפרה חזה','אם ננעלו'), true);
check('ג׳יבריש = ריק',     SongSearch.search(idx,'zzzqqxx',{limit:5}).length, 0);
check('שאילתה ריקה',       SongSearch.search(idx,'   ',{limit:5}).length, 0);

/* ---------------- guess acceptance ---------------- */
section('קבלת ניחוש חופשי (בלי בחירה מהרשימה)');
var nin = song('עפרה','ננעלו'), rak = song('משינה','רכבת'), tel = song('עומר אדם','תל אביב');
check('מדויק',                 SongSearch.matchesSong('אם ננעלו', nin), true);
check('שגיאת כתיב ע/א',        SongSearch.matchesSong('אם ננאלו', nin), true);
check('אות כפולה בטעות',       SongSearch.matchesSong('רכבת ליללה', rak), true);
check('זמר + שיר',             SongSearch.matchesSong('עפרה חזה אם ננעלו', nin), true);
check('דוחה שיר אחר',          SongSearch.matchesSong('תל אביב', nin), false);
check('דוחה מילה גנרית קצרה',  SongSearch.matchesSong('אם', nin), false);
check('דוחה שם זמר בלבד',      SongSearch.matchesSong('עפרה חזה', nin), false);
check('מקבל תל אביב הנכון',    SongSearch.matchesSong('תל אביב', tel), true);

/* ---------------- game rules ---------------- */
section('חוקי המשחק');
check('חמישה שלבים',        Game.STAGES, [0.1,0.5,2,8,15]);
var g = new Game(DB);
g.resetStats();
var r = g.newRound(nin);
check('מתחיל ב-0.1',        g.stageSeconds(), 0.1);
g.guess(null,'שיר לא נכון בכלל');
check('טעות מקדמת ל-0.5',   g.stageSeconds(), 0.5);
g.skip();
check('דילוג מקדם ל-2',      g.stageSeconds(), 2);
g.skip(); g.skip();
check('הגיע ל-15',           g.stageSeconds(), 15);
check('עדיין משחק',          g.round.status, 'playing');
g.guess(null,'עוד ניחוש שגוי לגמרי');
check('טעות ב-15 = הפסד',    g.round.status, 'lost');
check('נחשף השיר הנכון',     g.round.song.id, nin.id);

var g2 = new Game(DB); g2.resetStats();
g2.newRound(rak);
var res = g2.guess(rak, '');
check('ניחוש נכון = ניצחון', res.correct && g2.round.status==='won', true);
check('ניקוד מלא ב-0.1',     g2.stats.score, 100);
check('רצף עלה',             g2.stats.streak, 1);
check('אחרי סיום אין שינוי', (function(){ var b=g2.stats.played; g2.guess(rak,''); return g2.stats.played===b; })(), true);

/* ---------------- transliteration bridge ---------------- */
/* Apple titles some Israeli tracks in transliteration ("Omed Basha'ar")
 * rather than Hebrew. The build folds those into their Hebrew twin where
 * one exists; for the rest, typing Hebrew still has to find and win them. */
section('גשר תעתיק לטיני-עברי');
function skelPair(lat, heb){ return Heb.latSkeleton(lat) === Heb.hebSkeleton(heb); }
check('עומד בשער',      skelPair("Omed Basha'ar", 'עומד בשער'), true);
check('בשנה הבאה',      skelPair("Bashana Haba'a", 'בשנה הבאה'), true);
check('כביש החוף',      skelPair('Kvish Hachof', 'כביש החוף'), true);
check('סלסולים',        skelPair('Silsulim', 'סלסולים'), true);
check('שמחות קטנות',    skelPair('Smachot Ktanot', 'שמחות קטנות'), true);
check('נקודה טובה',     skelPair('Nekuda Tova', 'נקודה טובה'), true);
check('ה נשמעת בתחילת מילה', Heb.hebSkeleton('הכל'), 'HKL');
check('ה שותקת באמצע',  Heb.hebSkeleton('בשנה'), 'BSN');
check('שירים שונים לא מתבלבלים', Heb.latSkeleton('Tik Tok') === Heb.hebSkeleton('עומד בשער'), false);

(function(){
  var lat = DB.filter(function(s){ return !/[א-ת]/.test(s.title); });
  if (!lat.length) { check('אין יותר כותרות לטיניות לבדוק', true, true); return; }
  var sample = lat[0];
  /* whatever remains in Latin must still be reachable by its own title */
  check('כותרת לטינית נמצאת בחיפוש',
    SongSearch.search(idx, sample.title, {limit:1}).length > 0, true);
  check('כותרת לטינית מתקבלת כניחוש',
    SongSearch.matchesSong(sample.title, sample), true);
})();

/* ---------------- onset detection ---------------- */
/* Synthetic buffers, so these are deterministic and need no network.
 * Roughly one Apple preview in seven opens on silence or a fade-in, which
 * made the 0.1s level unplayable until we started at the real onset. */
section('איתור תחילת הצליל');
(function(){
  var AC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  if (!AC) { check('OfflineAudioContext זמין', false, true); return; }
  var sr = 44100, secs = 30;
  var oc = new AC(1, sr*secs, sr);

  function buildBuffer(silentSeconds){
    var b = oc.createBuffer(1, sr*secs, sr);
    var d = b.getChannelData(0);
    for (var i = Math.floor(sr*silentSeconds); i < d.length; i++){
      d[i] = (i % 97 / 97 - 0.5) * 0.8;   /* steady loud-ish signal */
    }
    return b;
  }

  var f = SnippetPlayer._findOnset;

  var quiet2s = f(buildBuffer(2));
  check('מדלג על 2 שניות שקט', quiet2s > 1.8 && quiet2s < 2.4, true);

  var quietHalf = f(buildBuffer(0.5));
  check('מדלג על חצי שניה שקט', quietHalf > 0.35 && quietHalf < 0.9, true);

  check('שיר שמתחיל חזק נשאר ב-0', f(buildBuffer(0)), 0);

  /* an all-silent clip has no onset to find; must not return nonsense */
  var silent = oc.createBuffer(1, sr*secs, sr);
  check('קליפ שקט לגמרי מחזיר 0', f(silent), 0);

  /* the 15s level must still fit after the offset */
  check('משאיר מקום ל-15 שניות', f(buildBuffer(2)) + 15 <= secs, true);

  /* a lone click must not be mistaken for the start of the music */
  var clicky = oc.createBuffer(1, sr*secs, sr);
  var cd = clicky.getChannelData(0);
  cd[Math.floor(sr*0.2)] = 1; cd[Math.floor(sr*0.2)+1] = -1;   /* 2-sample pop */
  for (var j = Math.floor(sr*5); j < cd.length; j++) cd[j] = (j % 97 / 97 - 0.5) * 0.8;
  var afterClick = f(clicky);
  check('מתעלם מנקישה בודדת', afterClick > 4.5, true);
})();

/* ---------------- database integrity ---------------- */
section('תקינות מאגר השירים');
check('יש שירים',              DB.length > 500, true);
check('לכל שיר יש קדימון',      DB.filter(function(s){return !s.preview;}).length, 0);
check('לכל שיר יש כותרת',       DB.filter(function(s){return !s.title;}).length, 0);
check('לכל שיר יש זמר',         DB.filter(function(s){return !s.artist;}).length, 0);
check('מזהים ייחודיים',         new Set(DB.map(function(s){return s.id;})).size, DB.length);
check('קדימונים מ-Apple בלבד',  DB.filter(function(s){return s.preview.indexOf('https://')!==0;}).length, 0);
['mizrahit','90s','2000s'].forEach(function(gen){
  check('סגנון "'+gen+'" מאוכלס', DB.filter(function(s){return s.genres.indexOf(gen)!==-1;}).length >= 50, true);
});
check('כל הסגנונות בתפריט קיימים', Game.GENRES.filter(function(x){
  return x.id!=='all' && DB.filter(function(s){return s.genres.indexOf(x.id)!==-1;}).length < 5;
}).length, 0);

/* ---------------- english hip hop genre ---------------- */
section('היפ הופ עולמי');
(function(){
  var en = DB.filter(function(s){ return s.genres.indexOf('hiphopen') !== -1; });
  check('הסגנון מאוכלס', en.length >= 100, true);
  check('כל שיריו מסומנים אנגלית',
    en.filter(function(s){ return s.lang !== 'en'; }).length, 0);
  check('לא מתערבב בעשורים העבריים',
    en.filter(function(s){ return ['70s','80s','90s','2000s','2010s','2020s'].some(function(d){ return s.genres.indexOf(d) !== -1; }); }).length, 0);

  /* "הכול" must stay a Hebrew game */
  var g = new Game(DB); g.setGenre('all');
  check('"הכול" לא כולל אנגלית',
    g.pool().filter(function(s){ return s.lang === 'en'; }).length, 0);
  check('"הכול" עדיין מלא', g.pool().length > 800, true);

  g.setGenre('hiphopen');
  check('בחירת הסגנון מחזירה שירי אנגלית',
    g.pool().length === en.length && g.pool().every(function(s){ return s.lang === 'en'; }), true);

  /* chart artists are limited to the 2016-2024 window; the named ones aren't */
  var drake = DB.filter(function(s){ return s.artist === 'Drake'; });
  if (drake.length) {
    check('Drake מוגבל ל-2016-2024',
      drake.filter(function(s){ return s.year < 2016 || s.year > 2024; }).length, 0);
  }
  ['Kanye West','Travis Scott','JID','21 Savage','Future','Denzel Curry'].forEach(function(a){
    check('יש שירים של ' + a, DB.filter(function(s){ return s.artist === a; }).length > 0, true);
  });

  /* English titles have to be searchable and acceptable as guesses */
  if (en.length) {
    var sample = en[0];
    check('שיר אנגלי נמצא בחיפוש',
      SongSearch.search(idx, sample.title, {limit:1}).length > 0, true);
    check('שיר אנגלי מתקבל כניחוש',
      SongSearch.matchesSong(sample.title, sample), true);
    check('חיפוש לפי שם אמן אנגלי',
      SongSearch.search(idx, 'Kendrick Lamar', {limit:1}).length > 0, true);
  }
})();

/* ---------------- single-artist playlist ---------------- */
section('קטגוריית אייל גולן');
(function(){
  var eg = DB.filter(function(s){ return s.genres.indexOf('eyalgolan') !== -1; });
  check('הקטגוריה מאוכלסת', eg.length >= 30, true);
  check('רק שירים של אייל גולן',
    eg.filter(function(s){ return s.artist !== 'אייל גולן'; }).length, 0);
  check('כל שיריו במאגר נכללים',
    eg.length, DB.filter(function(s){ return s.artist === 'אייל גולן'; }).length);
  check('נשאר גם בסגנון מזרחית',
    eg.every(function(s){ return s.genres.indexOf('mizrahit') !== -1; }), true);

  var g = new Game(DB); g.setGenre('eyalgolan');
  check('בחירת הקטגוריה מסננת נכון',
    g.pool().length === eg.length, true);
})();

/* ---------------- hits, not deep cuts ---------------- */
section('רשימת הלהיטים מדויקת');
(function(){
  var named = ['Kanye West','Travis Scott','JID','21 Savage','Future','Denzel Curry'];
  var en = DB.filter(function(s){ return s.genres.indexOf('hiphopen') !== -1; });
  var chart = en.filter(function(s){ return named.indexOf(s.artist) === -1; });

  /* chart artists are capped tightly so only their best-known songs survive */
  var counts = {};
  chart.forEach(function(s){ counts[s.artist] = (counts[s.artist] || 0) + 1; });
  check('אמן מצעד לא עובר 5 שירים',
    Object.keys(counts).filter(function(a){ return counts[a] > 5; }).length, 0);

  /* the by-name artists keep their bigger allowance */
  check('האמנים שנבחרו בשם לא קוצצו',
    named.filter(function(a){ return DB.filter(function(s){ return s.artist === a; }).length < 10; }).length, 0);

  check('הרשימה התכווצה משמעותית', en.length < 450, true);
})();

/* ---------------- restore ---------------- */
Object.keys(SNAPSHOT).forEach(function(k){
  if (SNAPSHOT[k] === null) localStorage.removeItem(k); else localStorage.setItem(k, SNAPSHOT[k]);
});

var s = document.getElementById('summary');
s.className = fail ? 'fail' : 'pass';
s.textContent = fail ? (fail + ' בדיקות נכשלו · ' + pass + ' עברו')
                     : ('הכול תקין — ' + pass + ' בדיקות עברו ✓');
</script>
</body>
</html>
